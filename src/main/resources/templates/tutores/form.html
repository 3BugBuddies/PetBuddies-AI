<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title>Tutor · PetBuddies</title>
</head>
<body>
<main>
    <h1 th:text="${responsavelId != null ? 'Editar tutor' : 'Novo tutor'}">Novo tutor</h1>

    <form class="formulario" method="post" th:action="@{${acaoFormulario}}" th:object="${responsavelRequest}">

        <label for="nome">Nome</label>
        <input id="nome" type="text" th:field="*{nome}"/>
        <div class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">erro</div>

        <label for="telefone">Telefone</label>
        <input id="telefone" type="text" th:field="*{telefone}"/>
        <div class="erro-campo" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}">erro</div>

        <label for="email">E-mail</label>
        <input id="email" type="email" th:field="*{email}"/>
        <div class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">erro</div>

        <div class="acoes-formulario">
            <button type="submit">Salvar</button>
            <a class="botao secundario" th:href="@{/tutores}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
