<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Erro · PetBuddies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin"/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Nunito:wght@400;600;700&amp;display=swap"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="icon" th:href="@{/favicon.png}" type="image/png"/>
</head>
<body class="pagina-avulsa">
<main class="caixa-erro" th:switch="${status}">
    <th:block th:case="403">
        <h1>Acesso negado</h1>
        <p>Seu perfil não tem permissão para abrir esta página.</p>
    </th:block>
    <th:block th:case="404">
        <h1>Página não encontrada</h1>
        <p>O endereço não existe ou foi movido.</p>
    </th:block>
    <th:block th:case="*">
        <h1 th:text="${status} != null ? ('Erro ' + ${status}) : 'Erro'">Erro</h1>
        <p th:text="${message} != null and ${message} != '' ? ${message} : 'Não foi possível concluir a operação.'">
            mensagem
        </p>
    </th:block>
    <a th:href="@{/}">Voltar ao início</a>
</main>
</body>
</html>
