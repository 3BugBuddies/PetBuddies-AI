<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Entrar · PetBuddies</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="pagina-login">
<main class="caixa-login">
    <h1>PetBuddies</h1>
    <p class="subtitulo">Entre com seu e-mail e senha</p>
    <p class="mensagem-erro" th:if="${param.error}">E-mail ou senha inválidos.</p>
    <p class="mensagem-aviso" th:if="${param.logout}">Sessão encerrada.</p>
    <form th:action="@{/login}" method="post">
        <label for="username">E-mail</label>
        <input id="username" type="email" name="username" required="required" autofocus="autofocus"/>
        <label for="password">Senha</label>
        <input id="password" type="password" name="password" required="required"/>
        <button type="submit">Entrar</button>
    </form>
</main>
</body>
</html>
