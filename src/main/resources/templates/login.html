<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Entrar · PetBuddies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin"/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Nunito:wght@400;600;700&amp;display=swap"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="icon" th:href="@{/favicon.png}" type="image/png"/>
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}"/>
</head>
<body class="pagina-login">
<main class="caixa-login">
    <img class="logo-login" th:src="@{/images/petbuddies-logo.png}"
         alt="PetBuddies" width="150" height="156"/>
    <p class="subtitulo">Entre com seu e-mail e senha</p>

    <p class="mensagem-erro" th:if="${param.error}" style="text-align:left;margin-top:1.2rem;margin-bottom:0">
        E-mail ou senha inválidos.
    </p>
    <p class="mensagem-aviso" th:if="${param.logout}" style="text-align:left;margin-top:1.2rem;margin-bottom:0">
        Sessão encerrada.
    </p>

    <form class="formulario" th:action="@{/login}" method="post">
        <label for="username">E-mail</label>
        <input id="username" type="email" name="username" required="required" autofocus="autofocus"/>
        <label for="password">Senha</label>
        <input id="password" type="password" name="password" required="required"/>
        <div class="acoes-formulario">
            <button type="submit">Entrar</button>
        </div>
    </form>
</main>
</body>
</html>
