<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title>Clínica · PetBuddies</title>
</head>
<body>
<main>
    <h1>Dados da clínica</h1>

    <p class="mensagem-sucesso" th:if="${sucesso}" th:text="${sucesso}">ok</p>

    <form class="formulario" method="post" th:action="@{/clinica}" th:object="${clinicaRequest}">

        <label for="nome">Nome</label>
        <input id="nome" type="text" th:field="*{nome}"/>
        <div class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">erro</div>

        <label for="cnpj">CNPJ (14 dígitos, sem pontuação)</label>
        <input id="cnpj" type="text" th:field="*{cnpj}"/>
        <div class="erro-campo" th:if="${#fields.hasErrors('cnpj')}" th:errors="*{cnpj}">erro</div>

        <label for="telefone">Telefone</label>
        <input id="telefone" type="text" th:field="*{telefone}"/>
        <div class="erro-campo" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}">erro</div>

        <label for="email">E-mail</label>
        <input id="email" type="email" th:field="*{email}"/>
        <div class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">erro</div>

        <div class="acoes-formulario">
            <button type="submit">Salvar</button>
        </div>
    </form>
</main>
</body>
</html>
