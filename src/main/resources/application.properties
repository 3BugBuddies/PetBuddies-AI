spring.application.name=petbuddies-ai
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Oracle FIAP
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521/ORCL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# validate, nunca update: o Hibernate confere o schema e RECUSA subir se
# divergir, em vez de alterar o banco em silencio (ADR s3-17).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=${ORACLE_USER}
spring.jpa.open-in-view=false

# ── Flyway — quem cria o schema do cuidado (ADRs s3-17 e s3-23)
# baseline-on-migrate: o schema e compartilhado com o .NET, entao nunca esta
# vazio quando o Java sobe. Sem a chave o Flyway se recusa a migrar um schema
# nao vazio que nao tem tabela de historico.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# schemas: deliberadamente ausente. O Flyway cita o identificador do schema, e o
# ORACLE_USER esta em minusculas — "rm..." nao existe no Oracle, que guarda o
# nome em maiusculas. Sem a chave, o Flyway usa o schema corrente da conexao,
# que ja e o do proprio usuario. Ver ADR s3-23.

# ── Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.tags-sorter=none
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.default-produces-media-type=application/json

# ── Logging — console only
logging.level.br.com.fiap.petbuddies=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.tool.schema=WARN

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
