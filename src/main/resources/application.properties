spring.application.name=petbuddies-ai
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Spring AI — Gemini via endpoint OpenAI-compatible
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.chat.options.model=gemini-2.5-flash

spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10000

# ── Oracle
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521/ORCL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${ORACLE_USER}
spring.jpa.open-in-view=false

# ── Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# sem spring.flyway.schemas: o Flyway cita o nome e o Oracle o guarda em maiusculas

# ── Seguranca
petbuddies.jwt.secret=${PETBUDDIES_JWT_SECRET}
petbuddies.jwt.expiracao-horas=8

# ── Web
# sem iso, <input type="date"> nao faz bind em LocalDate e vira typeMismatch
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso
# a pagina de erro do Spring Security (403/404) precisa da mensagem no model
server.error.include-message=always
# o container nao tem pt-BR: sem isto o painel mostra "September"
spring.web.locale=pt-BR
spring.web.locale-resolver=fixed

# ── Swagger
springdoc.api-docs.path=/api-docs
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=true

# ── Logging
logging.level.org.hibernate.tool.schema=WARN
