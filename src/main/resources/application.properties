spring.application.name=petbuddies-ai
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Oracle FIAP
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521/ORCL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# validate, nunca update: o Hibernate confere o schema e RECUSA subir se
# divergir, em vez de alterar o banco em silencio (ADR s3-17).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=${ORACLE_USER}
spring.jpa.open-in-view=false
# Oracle 23 + Hibernate 6.4 preferem BOOLEAN nativo; todo booleano do DDL e' NUMBER(1).
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=NUMERIC

# ── Flyway — quem cria o schema deste servico (ADRs s3-17, s3-23 e s3-25)
# O SCHEMA E EXCLUSIVO DESTE SERVICO e nasce vazio: cada servico tem o proprio
# banco, um por servico. O compartilhamento com o .NET, que era a razao original
# do baseline-on-migrate, acabou com o s3-25 — e com ele o V2, porque nenhuma
# chave cruza servico.
# As duas chaves abaixo ficam como rede: elas so entram em acao se o Flyway
# encontrar um schema nao vazio sem tabela de historico, que e o caso de um banco
# reaproveitado de antes desta decisao. Em banco novo nao fazem diferenca.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# schemas: deliberadamente ausente. O Flyway cita o identificador do schema, e o
# usuario configurado pode estar em minusculas — "rm..." nao existe no Oracle,
# que guarda o nome em maiusculas. Sem a chave, o Flyway usa o schema corrente da
# conexao, que ja e o do proprio usuario. Ver ADR s3-23.

# ── Seguranca — o JWT do ADR s3-20
# O segredo NUNCA fica aqui: vem do ambiente, e e o mesmo valor byte a byte no
# .NET. Minimo de 32 bytes — abaixo disso a biblioteca recusa a chave e a
# aplicacao nao sobe, que e o comportamento desejado.
petbuddies.jwt.secret=${PETBUDDIES_JWT_SECRET}
petbuddies.jwt.expiracao-horas=8

# ── Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.tags-sorter=none
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.default-produces-media-type=application/json

# ── Logging — console only
logging.level.br.com.fiap.petbuddies=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.tool.schema=WARN

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
