spring.application.name=petbuddies-ai
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Spring AI — Gemini via endpoint OpenAI-compatible (ADR s3-13)
# temperature 0: sem ela a confianca por campo nao calibra (medido em 108 chamadas).
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.chat.options.model=gemini-2.5-flash
spring.ai.openai.chat.options.temperature=0

# ── Spring AI Retry (429 / erros transientes)
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=2000
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10000
spring.ai.retry.on-client-errors=false

# ── Oracle FIAP
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521/ORCL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# validate, nunca update: o Hibernate confere o schema e RECUSA subir se
# divergir, em vez de alterar o banco em silencio (ADR s3-17).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=${ORACLE_USER}
spring.jpa.open-in-view=false

# ── Flyway — quem cria o schema deste servico (ADRs s3-17, s3-23 e s3-25)
# O SCHEMA E EXCLUSIVO DESTE SERVICO e nasce vazio: cada servico tem o proprio
# banco, um por servico. O compartilhamento com o .NET, que era a razao original
# do baseline-on-migrate, acabou com o s3-25 — e com ele o V2, porque nenhuma
# chave cruza servico.
# As duas chaves abaixo ficam como rede: elas so entram em acao se o Flyway
# encontrar um schema nao vazio sem tabela de historico, que e o caso de um banco
# reaproveitado de antes desta decisao. Em banco novo nao fazem diferenca.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# schemas: deliberadamente ausente. O Flyway cita o identificador do schema, e o
# usuario configurado pode estar em minusculas — "rm..." nao existe no Oracle,
# que guarda o nome em maiusculas. Sem a chave, o Flyway usa o schema corrente da
# conexao, que ja e o do proprio usuario. Ver ADR s3-23.

# ── Seguranca — o JWT do ADR s3-20
# O segredo NUNCA fica aqui: vem do ambiente, e e o mesmo valor byte a byte no
# .NET. Minimo de 32 bytes — abaixo disso a biblioteca recusa a chave e a
# aplicacao nao sobe, que e o comportamento desejado.
petbuddies.jwt.secret=${PETBUDDIES_JWT_SECRET}
petbuddies.jwt.expiracao-horas=8

# ── Web (Thymeleaf, J4)
# Os *Request de DTO da API sao reaproveitados como objeto de formulario da
# web; sem isto, <input type="date"/datetime-local"> nao faz bind em
# LocalDate/LocalDateTime — vira typeMismatch mesmo com o valor preenchido.
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso
# A pagina de erro padrao (403 do Spring Security, 404 de rota inexistente)
# passa pelo BasicErrorController, fora do WebExceptionHandler — precisa da
# mensagem no model para nao ficar generica demais.
server.error.include-message=always

# ── Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.tags-sorter=none
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.default-produces-media-type=application/json

# ── Logging — console only
# DEBUG em br.com.fiap.petbuddies.service.CheckinExtracaoService expoe o prompt
# montado (vocabulario em tempo de execucao) e a resposta bruta do modelo.
logging.level.br.com.fiap.petbuddies=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.tool.schema=WARN

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
