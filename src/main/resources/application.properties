spring.application.name=petbuddies-ai
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Oracle FIAP
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521/ORCL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=${ORACLE_USER}
spring.jpa.open-in-view=false

# ── Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.tags-sorter=none
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.default-produces-media-type=application/json

# ── Logging — console only
logging.level.br.com.fiap.petbuddies=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.tool.schema=WARN

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
